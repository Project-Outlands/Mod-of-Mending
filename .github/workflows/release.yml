name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # The changelog step walks `git log previousTag...thisTag`, so it needs the real history rather than the single
        # commit a default shallow clone brings down.
        fetch-depth: 0
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
      name: Set up Gradle
    - name: Add permission
      run: chmod +x ./gradlew
    - name: Execute Gradle build
      run: ./gradlew build

    # GitHub's own release notes are assembled from merged pull requests, and this repository has none, so on its own
    # the body would be little more than a compare link. This composite action supplies the commit list from git
    # instead; the release step then appends the generated notes, which is where the Full Changelog link comes from.
    - name: Collect commits since the previous tag
      id: changes
      uses: simbo/changes-between-tags-action@v1

    # The `-dev` jar is the pre-remap artifact, published on purpose: contributors who want to run the dev runs against
    # a published build need exactly that one.
    - name: Publish GitHub release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "build/libs/*.jar"
        body: |
          ## Changes
          ${{ steps.changes.outputs.changes }}
        generateReleaseNotes: true
